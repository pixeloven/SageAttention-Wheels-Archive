# =============================================================================
# DISABLED: SageAttention3 Windows builds are not currently supported
# =============================================================================
#
# The Blackwell (sm_100a) architecture has compilation issues on Windows:
#
# 1. C++20 Feature Usage: The code uses C++20 structured binding captures
#    (mainloop_tma_ws.h:478) but builds with -std=c++17. This works on
#    Linux/GCC as an extension but fails on Windows/MSVC.
#
# 2. CUDA Toolchain: CUDA 12.8 with MSVC may have incomplete sm_100a support,
#    causing internal compiler errors (exit code -1/4294967295).
#
# To re-enable Windows builds in the future, try:
#   - Upgrade to C++20: Change -std=c++17 to -std=c++20 in setup.py
#   - Upgrade CUDA: Try CUDA 12.9+ which may have better Windows sm_100 support
#   - Check NVIDIA docs for Windows Blackwell toolchain requirements
#
# See: https://github.com/pixeloven/SageAttention/issues/XXX (if applicable)
# =============================================================================

name: Build SageAttention3 Wheels (Windows) [DISABLED]

on:
  workflow_call:
    inputs:
      build_profile:
        description: 'Build profile to use'
        required: true
        default: 'stable'
        type: string
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile to use'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable      # All builds

jobs:
  # This job always runs to provide a status check, but skips actual builds
  disabled-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Windows builds disabled
        run: |
          echo "::warning::SageAttention3 Windows builds are currently disabled due to Blackwell (sm_100a) toolchain incompatibilities with MSVC."
          echo ""
          echo "To re-enable, see comments at the top of this workflow file."
          echo ""
          echo "Possible fixes:"
          echo "  1. Upgrade to C++20 (-std=c++20 in setup.py)"
          echo "  2. Upgrade to CUDA 12.9+ for better Windows sm_100 support"
          echo "  3. Wait for NVIDIA to improve Windows Blackwell toolchain"

